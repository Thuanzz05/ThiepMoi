<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c70"/>
      <stop offset="100%" stop-color="#146c70"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Decorative ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>

  <!-- Star / sparkle icon centered -->
  <!-- 4-point star -->
  <path d="M16 5 L17.2 13.8 L26 16 L17.2 18.2 L16 27 L14.8 18.2 L6 16 L14.8 13.8 Z"
        fill="url(#star)" opacity="0.95"/>

  <!-- Small dots at cardinal points for elegance -->
  <circle cx="16" cy="3.5" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="16" cy="28.5" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="3.5" cy="16" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="28.5" cy="16" r="0.8" fill="#ffffff" opacity="0.5"/>
</svg>
